name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (Django + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: barberlife
          POSTGRES_USER: barberlife
          POSTGRES_PASSWORD: barberlife
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U barberlife"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: 'True'
      DJANGO_SECRET_KEY: ci-only-insecure-key
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: barberlife
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Las migraciones versionadas coinciden con los modelos
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (AUT-BE) con cobertura
        run: |
          coverage run manage.py test gestion -v 2
          coverage report --fail-under=75
          coverage xml
          coverage html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura-backend
          path: |
            backend/coverage.xml
            backend/htmlcov

  frontend:
    name: Frontend (Angular build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  api-e2e:
    name: API (Newman) y E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Mismo entorno que usa el equipo en local: Docker Compose con
      # PostgreSQL, MongoDB, backend (:8000) y frontend (:4200).
      - name: Levantar el entorno con Docker Compose
        run: docker compose up -d --build

      - name: Esperar a que la API y el frontend respondan
        run: |
          curl --retry 60 --retry-delay 5 --retry-connrefused --retry-all-errors -fsS -o /dev/null http://localhost:8000/api/servicios/
          curl --retry 60 --retry-delay 5 --retry-connrefused --retry-all-errors -fsS -o /dev/null http://localhost:4200/login

      - name: Cargar los datos demo (seed_demo)
        run: docker compose exec -T backend python manage.py seed_demo

      # --- API: Postman / Newman -------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Newman
        run: npm install -g newman newman-reporter-html

      - name: Newman - Autenticación y RBAC
        working-directory: tests/api/auth-rbac
        run: |
          newman run AuthRBAC.postman_collection.json -e entorno.local.json \
            -r cli,html,junit,json \
            --reporter-html-export reporte_newman.html \
            --reporter-junit-export reporte_newman_junit.xml \
            --reporter-json-export resultado_newman.json

      - name: Newman - Catálogo y turnos
        working-directory: tests/api/catalogo-turnos
        run: |
          newman run CatalogoTurnos.postman_collection.json -e entorno.local.json \
            -r cli,html,junit,json \
            --reporter-html-export reporte_newman.html \
            --reporter-junit-export reporte_newman_junit.xml \
            --reporter-json-export resultado_newman.json

      # --- E2E y accesibilidad: Playwright ---------------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: e2e/requirements.txt
      - name: Instalar Playwright y Chromium
        working-directory: e2e
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Tests E2E y de accesibilidad (reporte HTML en e2e/reportes)
        working-directory: e2e
        run: pytest

      # --- Evidencia ---------------------------------------------------------
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-newman
          path: |
            tests/api/auth-rbac/reporte_newman.html
            tests/api/auth-rbac/reporte_newman_junit.xml
            tests/api/auth-rbac/resultado_newman.json
            tests/api/catalogo-turnos/reporte_newman.html
            tests/api/catalogo-turnos/reporte_newman_junit.xml
            tests/api/catalogo-turnos/resultado_newman.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-playwright
          path: |
            e2e/reportes/reporte_e2e.html
            e2e/reportes/artefactos

      - name: Logs de los contenedores (si algo falló)
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Apagar el entorno
        if: always()
        run: docker compose down -v
