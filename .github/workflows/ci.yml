name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (Django + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: barberlife
          POSTGRES_USER: barberlife
          POSTGRES_PASSWORD: barberlife
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U barberlife"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: 'True'
      DJANGO_SECRET_KEY: ci-only-insecure-key
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: barberlife
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Las migraciones versionadas coinciden con los modelos
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (AUT-BE) con cobertura
        run: |
          coverage run manage.py test gestion -v 2
          coverage report --fail-under=75
          coverage xml
          coverage html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura-backend
          path: |
            backend/coverage.xml
            backend/htmlcov

  frontend:
    name: Frontend (Angular build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
